<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Cadastro de Empresa</title>
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-10">

            <div class="bg-white p-4 p-md-5 shadow rounded">

                <div class="mb-4 border-bottom pb-3">
                    <h2 class="mb-0">Cadastro de Empresa</h2>
                    <small class="text-muted">Preencha os dados da empresa</small>
                </div>

                <form class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Razão Social</label>
                        <input type="text" class="form-control" placeholder="Digite a razão social">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Nome Fantasia</label>
                        <input type="text" class="form-control" placeholder="Digite o nome fantasia">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">CNPJ</label>
                        <input type="text" class="form-control" placeholder="00.000.000/0000-00">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Inscrição Estadual</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Telefone</label>
                        <input type="tel" class="form-control" placeholder="(00) 00000-0000">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="empresa@email.com">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Site</label>
                        <input type="url" class="form-control" placeholder="www.empresa.com">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Endereço</label>
                        <input type="text" class="form-control" placeholder="Rua, número, bairro">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Cidade</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <select class="form-select">
                            <option selected>Selecione</option>
                            <option>DF</option>
                            <option>SP</option>
                            <option>RJ</option>
                            <option>MG</option>
                            <option>GO</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">CEP</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-12 mt-4">
                        <div class="d-flex justify-content-end gap-2">
                            <button type="reset" class="btn btn-outline-secondary">
                                Limpar
                            </button>

                            <button type="submit" class="btn btn-success px-4">
                                Cadastrar Empresa
                            </button>
                        </div>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

</body>
</html>
